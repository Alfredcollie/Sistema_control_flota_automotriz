name: Compilar para macOS

# Esto hace que se compile automáticamente cada vez que subes código a la rama "main"
# También permite ejecutarlo manualmente con "workflow_dispatch"
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # Versión estable recomendada

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar la aplicación con PyInstaller
      run: |
        # Usamos --collect-all customtkinter para que los colores y temas no se rompan
        # Usamos : en lugar de ; para agregar imágenes en macOS
        pyinstaller --noconfirm --windowed --name "ControlEventos" --add-data "Logo.png:." --add-data "Logo_Collie_Software.png:." --collect-all customtkinter control_general.py

    - name: Comprimir la aplicación en ZIP
      run: |
        # Las aplicaciones de Mac (.app) son en realidad carpetas. 
        # Hay que comprimirlas en ZIP para que no pierdan sus permisos al descargarlas.
        cd dist
        zip -r ControlEventos-Mac.zip "ControlEventos.app"

    - name: Subir el archivo final (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: ControlEventos-Mac-APP
        path: dist/ControlEventos-Mac.zip
