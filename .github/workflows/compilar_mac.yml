name: Compilar para macOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14 # <-- Esto fuerza a GitHub a usar una Mac con procesador M1

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar la aplicación con PyInstaller
      run: |
        # Compilamos la aplicación
        pyinstaller --noconfirm --windowed --name "ControlEventos" --add-data "Logo.png:." --add-data "Logo_Collie_Software.png:." --collect-all customtkinter control_general.py

    - name: Comprimir la aplicación (Modo Seguro Apple)
      run: |
        cd dist
        # Usamos 'ditto' en lugar de 'zip'. Esto preserva la estructura interna para M1/M2/M3.
        ditto -c -k --keepParent "ControlEventos.app" ControlEventos-Mac.zip

    - name: Subir el archivo final
      uses: actions/upload-artifact@v4
      with:
        name: ControlEventos-Mac-APP
        path: dist/ControlEventos-Mac.zip
