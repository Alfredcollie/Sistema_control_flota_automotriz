name: Compilar para macOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14 # Procesador M1

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar la aplicación con PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "ControlEventos" --add-data "Logo.png:." --add-data "Logo_Collie_Software.png:." --collect-all customtkinter control_general.py

    - name: Comprimir la aplicación (Preservando estructura Mac)
      run: |
        cd dist
        # La letra 'y' evita que se rompa la aplicación por dentro
        zip -ry ControlEventos-Mac.zip "ControlEventos.app"

    - name: Subir el archivo final
      uses: actions/upload-artifact@v4
      with:
        name: ControlFlota-Mac-APP
        path: dist/ControlFlota-Mac.zip
