name: Compilar y publicar (Windows + macOS)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag del release (ej. v1.5.5). Déjalo vacío si el push ya es un tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:

  # ===================== WINDOWS =====================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter psycopg2-binary keyring bcrypt reportlab pdfplumber pypdf PyMuPDF requests certifi pandas openpyxl Pillow fastapi uvicorn python-multipart google-genai cryptography

    - name: Descargar rclone (Windows)
      run: |
        curl.exe -L "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -o rclone.zip
        tar -xf rclone.zip
        $RCLONE_BIN = (Get-ChildItem -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
        Add-Content -Path $env:GITHUB_ENV -Value "RCLONE_BIN=$RCLONE_BIN"

    - name: Compilar con PyInstaller (Windows)
      run: pyinstaller --noconfirm --windowed --name "ControlFlota" --icon "Ico_Collie_Software.ico" --add-data "logo.png;." --add-data "Logo_Collie_Software.png;." --add-data "feriados_peru.json;." --add-binary "$env:RCLONE_BIN;." --collect-all customtkinter --collect-all keyring --collect-all certifi --hidden-import keyring.backends.Windows control_general.py

    - name: Inyectar credenciales de Supabase (config_db.json)
      shell: pwsh
      run: |
        @"
        {
          "host
