name: Compilar y publicar (Windows + macOS)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag del release (ej. v1.5.5). Déjalo vacío si el push ya es un tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:

  # ===================== WINDOWS =====================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter psycopg2-binary keyring bcrypt reportlab pdfplumber pypdf PyMuPDF requests certifi pandas openpyxl Pillow fastapi uvicorn python-multipart google-genai cryptography

    - name: Descargar rclone (Windows)
      run: |
        curl.exe -L "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -o rclone.zip
        tar -xf rclone.zip
        $RCLONE_BIN = (Get-ChildItem -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
        Add-Content -Path $env:GITHUB_ENV -Value "RCLONE_BIN=$RCLONE_BIN"

    - name: Compilar con PyInstaller (Windows)
      run: pyinstaller --noconfirm --windowed --name "ControlFlota" --icon "Ico_Collie_Software.ico" --add-data "logo.png;." --add-data "Logo_Collie_Software.png;." --add-data "feriados_peru.json;." --add-binary "$env:RCLONE_BIN;." --collect-all customtkinter --collect-all keyring --collect-all certifi --hidden-import keyring.backends.Windows control_general.py

    - name: Inyectar credenciales de Supabase (config_db.json)
      shell: pwsh
      env:
        SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        $config = @{
          host     = $env:SUPABASE_DB_HOST
          port     = $env:SUPABASE_DB_PORT
          dbname   = $env:SUPABASE_DB_NAME
          user     = $env:SUPABASE_DB_USER
          password = $env:SUPABASE_DB_PASSWORD
        }
        $config | ConvertTo-Json | Out-File -FilePath "dist/ControlFlota/config_db.json" -Encoding utf8

    - name: Validar secretos de licencia
      shell: pwsh
      run: |
        if ([string]::IsNullOrEmpty("${{ secrets.SUPABASE_LIC_DB_PASSWORD }}")) {
          Write-Error "FALTA el secreto SUPABASE_LIC_DB_PASSWORD. Crea los 5 secretos SUPABASE_LIC_DB_* en Settings -> Secrets -> Actions."
          exit 1
        }

    - name: Inyectar credenciales de licencia (config_licencia.json)
      shell: pwsh
      env:
        SUPABASE_LIC_DB_HOST: ${{ secrets.SUPABASE_LIC_DB_HOST }}
        SUPABASE_LIC_DB_PORT: ${{ secrets.SUPABASE_LIC_DB_PORT }}
        SUPABASE_LIC_DB_NAME: ${{ secrets.SUPABASE_LIC_DB_NAME }}
        SUPABASE_LIC_DB_USER: ${{ secrets.SUPABASE_LIC_DB_USER }}
        SUPABASE_LIC_DB_PASSWORD: ${{ secrets.SUPABASE_LIC_DB_PASSWORD }}
      run: |
        $config = @{
          host     = $env:SUPABASE_LIC_DB_HOST
          port     = $env:SUPABASE_LIC_DB_PORT
          dbname   = $env:SUPABASE_LIC_DB_NAME
          user     = $env:SUPABASE_LIC_DB_USER
          password = $env:SUPABASE_LIC_DB_PASSWORD
        }
        $config | ConvertTo-Json | Out-File -FilePath "dist/ControlFlota/config_licencia.json" -Encoding utf8

    - name: Copiar config_local.json al build (Windows)
      run: Copy-Item -Path "config_local.json" -Destination "dist/ControlFlota/config_local.json" -Force

    - name: Instalar Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Generar instalador (Inno Setup)
      run: iscc "Instalador.ControlFlota.iss"

    - name: Comprimir en ZIP (Windows)
      run: Compress-Archive -Path "dist/ControlFlota" -DestinationPath "dist/ControlFlota-Windows.zip" -Force

    - name: Subir artifact (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: |
          dist/Instalador.ControlFlota.exe
          dist/ControlFlota-Windows.zip

  # ===================== macOS =====================
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter psycopg2-binary keyring bcrypt reportlab pdfplumber pypdf PyMuPDF requests certifi pandas openpyxl Pillow fastapi uvicorn python-multipart google-genai cryptography

    - name: Descargar rclone (macOS)
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then
          URL="https://downloads.rclone.org/rclone-current-osx-arm64.zip"
        else
          URL="https://downloads.rclone.org/rclone-current-osx-amd64.zip"
        fi
        curl -L "$URL" -o rclone.zip
        unzip -o rclone.zip
        RCLONE_BIN=$(find . -maxdepth 2 -name rclone -type f | head -1)
        chmod +x "$RCLONE_BIN"
        echo "RCLONE_BIN=$RCLONE_BIN" >> "$GITHUB_ENV"

    - name: Compilar con PyInstaller (macOS)
      run: pyinstaller --noconfirm --windowed --name "ControlFlota" --icon "Ico_Collie_Software.icns" --add-data "logo.png:." --add-data "Logo_Collie_Software.png:." --add-data "feriados_peru.json:." --add-binary "${RCLONE_BIN}:." --collect-all customtkinter --collect-all keyring --collect-all certifi --hidden-import keyring.backends.macOS control_general.py

    - name: Inyectar credenciales de Supabase (config_db.json)
      run: |
        cat > "dist/ControlFlota.app/Contents/MacOS/config_db.json" << 'EOF'
        {
          "host": "${{ secrets.SUPABASE_DB_HOST }}",
          "port": "${{ secrets.SUPABASE_DB_PORT }}",
          "dbname": "${{ secrets.SUPABASE_DB_NAME }}",
          "user": "${{ secrets.SUPABASE_DB_USER }}",
          "password": "${{ secrets.SUPABASE_DB_PASSWORD }}"
        }
        EOF

    - name: Validar secretos de licencia
      run: |
        if [ -z "${{ secrets.SUPABASE_LIC_DB_PASSWORD }}" ]; then
          echo "ERROR: FALTA el secreto SUPABASE_LIC_DB_PASSWORD. Crea los 5 secretos SUPABASE_LIC_DB_* en Settings -> Secrets -> Actions." >&2
          exit 1
        fi

    - name: Inyectar credenciales de licencia (config_licencia.json)
      run: |
        cat > "dist/ControlFlota.app/Contents/MacOS/config_licencia.json" << 'EOF'
        {
          "host": "${{ secrets.SUPABASE_LIC_DB_HOST }}",
          "port": "${{ secrets.SUPABASE_LIC_DB_PORT }}",
          "dbname": "${{ secrets.SUPABASE_LIC_DB_NAME }}",
          "user": "${{ secrets.SUPABASE_LIC_DB_USER }}",
          "password": "${{ secrets.SUPABASE_LIC_DB_PASSWORD }}"
        }
        EOF

    - name: Copiar config_local.json al build (macOS)
      run: cp "config_local.json" "dist/ControlFlota.app/Contents/MacOS/config_local.json"

    # Las credenciales DENTRO de la app evitan que macOS pida la clave del
    # llavero (antes salían 6 avisos: 5 datos de Supabase + 1 de licencias).
    - name: Verificar credenciales incluidas (macOS, evita el aviso del llavero)
      run: |
        APP="dist/ControlFlota.app"
        for f in config_db.json config_licencia.json config_local.json; do
          if [ ! -s "$APP/Contents/MacOS/$f" ]; then
            echo "ERROR: falta $f dentro de la app." >&2
            echo "       Sin ese archivo la app abre el llavero y macOS pide la clave del usuario." >&2
            exit 1
          fi
        done
        echo "OK: credenciales incluidas; la app no pedirá la clave del llavero."

    - name: Forzar Modo Claro en la app (macOS)
      run: |
        plutil -replace NSRequiresAquaSystemAppearance -bool YES "$PWD/dist/ControlFlota.app/Contents/Info.plist" 2>/dev/null || plutil -insert NSRequiresAquaSystemAppearance -bool YES "$PWD/dist/ControlFlota.app/Contents/Info.plist" || true

    # Firma ESTABLE: con el mismo certificado en cada compilación macOS
    # reconoce siempre la misma aplicación y conserva los permisos que el
    # usuario conceda. Con la firma ad-hoc (-) la identidad cambia en cada
    # versión y macOS vuelve a preguntar todo de nuevo.
    # Se activa creando los secretos MAC_CERT_P12_BASE64 y MAC_CERT_PASSWORD
    # (certificado .p12 de "Code Signing" exportado en base64). Si no existen,
    # el workflow sigue funcionando con firma ad-hoc.
    - name: Preparar identidad de firma estable (macOS)
      env:
        MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
        MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      run: |
        if [ -z "${MAC_CERT_P12_BASE64}" ]; then
          echo "SIN_IDENTIDAD=1" >> "$GITHUB_ENV"
          echo "Aviso: no hay certificado (secreto MAC_CERT_P12_BASE64). Se firmará en modo ad-hoc."
          exit 0
        fi
        echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        KEYCHAIN="build.keychain"
        security create-keychain -p "" "$KEYCHAIN"
        security set-keychain-settings -lut 3600 "$KEYCHAIN"
        security unlock-keychain -p "" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN"
        rm -f "$RUNNER_TEMP/cert.p12"
        IDENTIDAD="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
        if [ -z "$IDENTIDAD" ]; then
          echo "SIN_IDENTIDAD=1" >> "$GITHUB_ENV"
          echo "Aviso: el certificado no contiene una identidad de firma válida; se usará firma ad-hoc."
        else
          echo "SIGN_IDENTITY=$IDENTIDAD" >> "$GITHUB_ENV"
          echo "Identidad de firma: $IDENTIDAD"
        fi

    - name: Firmar la app (macOS, corrige la firma tras inyectar archivos)
      run: |
        APP="dist/ControlFlota.app"
        # Limpiar atributos extendidos/cuarentena ANTES de firmar
        xattr -cr "$APP" || true
        if [ -n "${SIGN_IDENTITY:-}" ] && [ -z "${SIN_IDENTIDAD:-}" ]; then
          codesign --force --deep --sign "$SIGN_IDENTITY" "$APP"
        else
          codesign --force --deep --sign - "$APP"
        fi
        codesign --verify --deep --strict --verbose=2 "$APP"

    - name: Comprimir en ZIP (macOS)
      run: |
        cd dist
        zip -r ControlFlota-Mac.zip "ControlFlota.app"

    - name: Crear instalador DMG (macOS)
      run: |
        cd dist
        mkdir -p dmg
        cp -R "ControlFlota.app" dmg/
        ln -s /Applications dmg/Applications
        hdiutil create -volname "Control Flota" -srcfolder dmg -ov -format UDZO "Instalador.ControlFlota.dmg"

    - name: Subir artifact (macOS)
      uses: actions/upload-artifact@v4
      with:
        name: mac
        path: |
          dist/ControlFlota-Mac.zip
          dist/Instalador.ControlFlota.dmg

  # ===================== RELEASE =====================
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')

    steps:
    - name: Descargar artifact Windows
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: release-assets

    - name: Descargar artifact macOS
      uses: actions/download-artifact@v4
      with:
        name: mac
        path: release-assets

    - name: Ver archivos a publicar
      run: ls -la release-assets

    - name: Publicar en GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        name: ControlFlota ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        files: |
          release-assets/*.zip
          release-assets/*.dmg
          release-assets/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
